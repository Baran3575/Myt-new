name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build signed APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate release keystore
        run: |
          keytool -genkeypair -v \
            -keystore myt-release.keystore \
            -alias myt \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass mytstorepass \
            -keypass mytstorepass \
            -dname "CN=Myt, OU=Personal, O=Personal, L=City, S=State, C=US"
          echo "Keystore created."

      - name: Configure signing + optional Jamendo key
        env:
          JAMENDO_CLIENT_ID: ${{ secrets.JAMENDO_CLIENT_ID }}
        run: |
          cat >> gradle.properties <<EOF
          MYT_KEYSTORE_PATH=$GITHUB_WORKSPACE/myt-release.keystore
          MYT_KEYSTORE_PASS=mytstorepass
          MYT_KEY_ALIAS=myt
          MYT_KEY_PASS=mytstorepass
          MYT_JAMENDO_CLIENT_ID=$JAMENDO_CLIENT_ID
          EOF
          chmod +x gradlew

      - name: Build APKs
        run: ./gradlew assembleRelease assembleDebug --no-daemon --stacktrace

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: myt-apks
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30